name = "bauhaus"
main = "src/index.ts"
compatibility_date = "2026-06-12"
compatibility_flags = ["nodejs_compat"]

# No [limits] block: cpu_ms caps CPU time per invocation, and this was set to
# 1 — one millisecond — which arrived by way of a 1.25 truncated to satisfy the
# integer schema rather than by any deliberate budget. Falling back to the
# platform default is correct for a handler whose work is R2 reads.

[observability.logs]
enabled = true
invocation_logs = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bauhaus"

[[analytics_engine_datasets]]
binding = "WEB_VITALS"
dataset = "web_vitals"

[[analytics_engine_datasets]]
binding = "WEB_ERRORS"
dataset = "web_errors"

[vars]
ALLOWED_ORIGINS = "https://kevintcoughlin.com,https://www.kevintcoughlin.com"
