name: Generate Daily Art (Self-Hosted)

# Dispatch only, deliberately. This workflow and generate.yml both used to run
# at 04:00 UTC, writing the same R2 keys for the same date from two different
# artworks. Because the uploads interleave key-by-key rather than atomically,
# a losing race could leave the served image and its metadata describing
# different artworks. generate.yml is the scheduled generator; run this one by
# hand when you want the always-on self-hosted box.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Art source for this run"
        required: false
        type: choice
        default: met
        options: [met, artic, unsplash]
      overwrite:
        description: "Republish today even if it already exists (breaks immutable caches)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Generate without uploading to R2"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Not generate.yml's group: a job queued here while the runner is offline would
# hold that group and stall the scheduled run behind it.
concurrency:
  group: generate-self-hosted
  cancel-in-progress: false

jobs:
  generate:
    # Rootless Podman container on the Fedora workstation (quadlet unit
    # bauhaus-runner.container). The image bakes in git, curl and uv; the
    # container sets UV_CACHE_DIR, UV_PYTHON_INSTALL_DIR and
    # BAUHAUS_MODELS_CACHE under its persistent work volume.
    runs-on: [self-hosted, bauhaus-fedora]
    timeout-minutes: 20
    # The `secrets` context is not available in step-level `if:` conditions,
    # but `env` is — so gate values must be surfaced here.
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev --python 3.14

      # Checkout cleans untracked files, so keep weights outside the workspace
      # and link them in; download_models.py verifies checksums either way.
      - name: Download models (cached on disk)
        run: |
          mkdir -p "$BAUHAUS_MODELS_CACHE"
          ln -sfn "$BAUHAUS_MODELS_CACHE" models/weights
          uv run --script models/download_models.py

      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Per-job keyring in the job's temp dir (wiped between jobs), so the
        # signing key never lingers in the long-lived runner container.
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG key imported."

      # CC0 museum source by default — see the note in generate.yml.
      - name: Generate and upload
        run: |
          uv run python src/main.py --source "${SOURCE}" \
            ${OVERWRITE:+--overwrite} ${DRY_RUN:+--dry-run}
        env:
          SOURCE: ${{ inputs.source || 'met' }}
          # Publishing is write-once, so a dispatch on a day generate.yml has
          # already run needs this checked to proceed.
          OVERWRITE: ${{ inputs.overwrite && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: bauhaus
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          STYLE_MODE: curated
          LANDSCAPES_ONLY: 'true'
          MEMORY_PROFILE: balanced
          MAX_SIZE: '1536'
          GENERATE_VARIANTS: 'true'
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Remove GPG keyring
        if: always() && env.GNUPGHOME != ''
        run: rm -rf "$GNUPGHOME"

      - name: Notify success
        if: success() && !inputs.dry_run && env.NTFY_TOPIC != ''
        continue-on-error: true
        run: |
          curl -f --max-time 10 --retry 2 --retry-delay 2 \
            -H "Title: Daily art generation succeeded (self-hosted)" \
            -H "Priority: default" \
            -H "Tags: white_check_mark,penguin" \
            -H "Actions: view, Open Run, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Self-hosted generate completed successfully." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Notify failure
        if: failure() && env.NTFY_TOPIC != ''
        continue-on-error: true
        run: |
          curl -f --max-time 10 --retry 2 --retry-delay 2 \
            -H "Title: Daily art generation failed (self-hosted)" \
            -H "Priority: high" \
            -H "Tags: x,penguin" \
            -H "Actions: view, Open Run, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Self-hosted generate failed. Check the run logs." \
            "https://ntfy.sh/$NTFY_TOPIC"
