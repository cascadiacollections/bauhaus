name: Generate Daily Art

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Art source for this run"
        required: false
        type: choice
        default: met
        options: [met, artic, unsplash]
      overwrite:
        description: "Republish today even if it already exists (breaks immutable caches)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC (8 PM PT prev day) — off-peak

permissions:
  contents: read

# One generation at a time: a manual dispatch must not race the scheduled run
# for the same date's R2 keys.
concurrency:
  group: generate-daily-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level env: the `secrets` context is not available in step-level `if:`
    # conditions, but `env` is — so gate values must be surfaced here.
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: '3.14'

      - uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('uv.lock') }}

      # Keyed on the download script so that changing a pinned checksum (or the
      # release URL) evicts weights cached under the old pins. A constant key
      # can never invalidate, which would pin a bad cache entry forever.
      - uses: actions/cache@v6
        with:
          path: models/weights
          key: adain-models-${{ hashFiles('models/download_models.py') }}

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Download models
        run: uv run --script models/download_models.py

      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG key imported."

      # Scheduled runs use CC0 museum sources so every published image is
      # uniformly CC0 and no API key is on the critical path. Unsplash stays
      # available via the workflow_dispatch input (its licence is not CC0,
      # so those runs produce source-dependent output).
      - name: Generate and upload
        run: |
          uv run python src/main.py --source "${SOURCE}" \
            ${OVERWRITE:+--overwrite} ${SKIP_IF_PUBLISHED:+--skip-if-published}
        env:
          SOURCE: ${{ inputs.source || 'met' }}
          # Empty unless the dispatch input is checked; ${VAR:+--overwrite}
          # then expands to nothing, so scheduled runs never pass the flag.
          OVERWRITE: ${{ inputs.overwrite && '1' || '' }}
          # Scheduled runs only. A dispatch after 17:00 PT lands on tomorrow's
          # UTC date, so the next morning's cron finds the day already
          # published — a no-op, not a fault, and it must not go red or page.
          # A manual dispatch that collides still fails loudly: there the
          # operator asked for a publish and did not get one.
          SKIP_IF_PUBLISHED: ${{ github.event_name == 'schedule' && '1' || '' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: bauhaus
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          STYLE_MODE: curated
          LANDSCAPES_ONLY: 'true'
          MEMORY_PROFILE: balanced
          MAX_SIZE: '1536'
          GENERATE_VARIANTS: 'true'
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Notify success
        if: success() && env.NTFY_TOPIC != ''
        continue-on-error: true
        run: |
          curl -f --max-time 10 --retry 2 --retry-delay 2 \
            -H "Title: Daily art generation succeeded" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            -H "Actions: view, Open Run, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Generate workflow completed successfully." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Notify failure
        if: failure() && env.NTFY_TOPIC != ''
        continue-on-error: true
        run: |
          curl -f --max-time 10 --retry 2 --retry-delay 2 \
            -H "Title: Daily art generation failed" \
            -H "Priority: high" \
            -H "Tags: x" \
            -H "Actions: view, Open Run, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Generate workflow failed. Check the run logs for details." \
            "https://ntfy.sh/$NTFY_TOPIC"
