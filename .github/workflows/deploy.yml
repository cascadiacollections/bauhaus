name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '24'
  WORKER_URL: 'https://bauhaus.cascadiacollections.workers.dev'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: worker
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # /api/today.json exercises the deployed code *and* the art in GitHub
      # Releases, so a 404 here usually means no day has been published in the
      # Worker's 14-day window (Generate Daily Art is failing), not a bad
      # deploy. Report the HTTP status and body so the two are told apart.
      - name: Post-deploy health check
        run: |
          sleep 3
          BODY="$RUNNER_TEMP/today.json"
          CODE=$(curl -s -o "$BODY" -w '%{http_code}' --retry 2 --retry-delay 2 --max-time 10 \
            "${WORKER_URL}/api/today.json" || echo "000")
          if [ "$CODE" != "200" ]; then
            echo "::error::Health check failed — /api/today.json returned HTTP $CODE: $(head -c 300 "$BODY" 2>/dev/null)"
            if [ "$CODE" = "404" ]; then
              echo "::error::The Worker is up but has no artwork to serve; check the Generate Daily Art workflow."
            fi
            exit 1
          fi
          STATUS=$(python3 -c "import sys,json; print(json.load(open(sys.argv[1])).get('license',''))" "$BODY" || echo "unparseable JSON")
          if [ "$STATUS" != "CC0-1.0" ] && [ "$STATUS" != "Unsplash License" ]; then
            echo "::error::Health check failed — unexpected license: $STATUS"
            exit 1
          fi
          echo "::notice::Deploy successful - API returning valid license: $STATUS"

      - name: Notify success
        if: success() && env.NTFY_TOPIC != ''
        continue-on-error: true
        run: |
          curl -f --max-time 10 --retry 2 --retry-delay 2 \
            -H "Title: Worker deployment succeeded" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            -H "Actions: view, Open Run, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Deploy workflow completed successfully." \
            "https://ntfy.sh/$NTFY_TOPIC"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Notify failure
        if: failure() && env.NTFY_TOPIC != ''
        continue-on-error: true
        run: |
          curl -f --max-time 10 --retry 2 --retry-delay 2 \
            -H "Title: Worker deployment failed" \
            -H "Priority: high" \
            -H "Tags: x" \
            -H "Actions: view, Open Run, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Deploy workflow failed. Check the run logs for details." \
            "https://ntfy.sh/$NTFY_TOPIC"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
