name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.mise.toml'
      - 'justfile'
      - 'styles/**'
  # Also on main: without this the merge commit is never verified, and the
  # badge has no run to report.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # An invalid workflow file does not fail any PR check — GitHub simply
  # refuses to run it, and scheduled runs stop being created silently.
  # This job turns that failure mode into a red check.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint

      - name: Lint workflows
        run: ./actionlint -color

  # Primary job: runs inside the very image the Dockerfile builds from, so CI
  # exercises the production interpreter and libc rather than approximating
  # them with a runner image.
  python:
    name: Python (debian, 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.14-slim
    env:
      # The container already pins the interpreter this project wants; uv
      # should use it rather than downloading a managed CPython.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      # actions/checkout needs git, and the slim image ships without it.
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --locked, not --frozen: --frozen only skips re-locking, it does not
      # verify that uv.lock still satisfies pyproject.toml. --locked fails the
      # build when the two have drifted apart.
      - name: Install dependencies
        run: uv sync --locked

      - name: Check imports
        run: uv run python -c "from fetch import fetch_artwork; from stylize import StyleTransfer; from upload import upload; from postprocess import postprocess; print('OK')"
        working-directory: src

      - name: Run tests
        run: uv run pytest -v

  # Secondary job: the self-hosted generator is an ARM64 Mac, and
  # stylize._select_device() has an MPS branch nothing else exercises.
  python-macos:
    name: Python (macOS ARM64, 3.14)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # uv provisions the interpreter itself — no separate setup-python step.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  lint:
    name: Lint + audit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Ruff
        run: uvx ruff check --output-format=github .

      # pip-audit with no target audits its OWN environment and reports a
      # confident all-clear. It has to be pointed at the project's resolved
      # dependency set, which is what the export produces.
      - name: Audit dependencies
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --progress-spinner off

  podman:
    name: Podman smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: podman build -t bauhaus:test .
      - name: Run dry-run smoke
        run: podman run --rm bauhaus:test --dry-run --source met --skip-quality-check --max-size 1024 --variants=false

  worker:
    name: Worker (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: worker
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: worker
        run: npm test

  # The Python port in worker-py/ ships its own dependency set and test suite,
  # neither of which the root Python jobs cover: those resolve the root
  # pyproject.toml, not this one.
  worker-py:
    name: Worker (Python port)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: worker-py
          sparse-checkout-cone-mode: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: '3.13'

      # --locked fails rather than silently re-resolving, so a lockfile that has
      # drifted from pyproject.toml is a red check instead of a quiet difference
      # between what CI tested and what deploys.
      - name: Install dependencies
        working-directory: worker-py
        run: uv sync --locked

      # This lockfile has twice been regenerated behind a private package
      # mirror, which silently rewrites every artifact URL to an internal feed
      # that no one else can resolve. Catching it here makes that a red check
      # rather than a broken install for the next person.
      - name: Verify lockfile resolves against public PyPI
        working-directory: worker-py
        run: |
          BAD=$(grep -o 'url = "[^"]*"' uv.lock | grep -cv 'https://files\.pythonhosted\.org/' || true)
          if [ "$BAD" -ne 0 ]; then
            echo "::error::uv.lock has $BAD non-PyPI artifact URLs. Regenerate it with public PyPI access."
            grep -o 'url = "[^"]*"' uv.lock | grep -v 'https://files\.pythonhosted\.org/' | head -5
            exit 1
          fi
          echo "::notice::All lockfile artifact URLs point at files.pythonhosted.org"

      - name: Run tests
        working-directory: worker-py
        run: uv run pytest -v

      # Matches the root lint job: pip-audit with no target audits its own
      # environment and reports a confident all-clear, so it is pointed at this
      # project's resolved dependency set.
      - name: Audit dependencies
        working-directory: worker-py
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --progress-spinner off
