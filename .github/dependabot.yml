version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # "uv", not "pip": the pip ecosystem edits pyproject.toml but leaves
  # uv.lock untouched, which silently desynchronises the lockfile from the
  # declared constraints. The uv ecosystem updates both together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
